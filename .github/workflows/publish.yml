name: Build, test and publish

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wonrich.QualityPanel.slnx

      - name: Build
        run: dotnet build Wonrich.QualityPanel.slnx --configuration Release --no-restore

      # The calculations here decide whether a delivery is paid for, so a red suite must stop the
      # package reaching a consumer rather than being noticed afterwards.
      - name: Test
        run: dotnet test Wonrich.QualityPanel.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Wonrich.QualityPanel/Wonrich.QualityPanel.csproj --configuration Release --no-build --output ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  publish:
    # Only what has landed on a protected branch is published, so a consumer can never restore a
    # version that came from an unreviewed branch.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/Wonrich.QualityPanel/Wonrich.QualityPanel.csproj --configuration Release --output ./artifacts

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "./artifacts/*.nupkg" \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
